<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 명예의 전당 🏆</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        :root { --bg-color: #f0f4f8; --primary-color: #ff6b6b; --text-color: #2d3436; --white: #ffffff; }
        body { font-family: 'Jua', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: var(--white); width: 90%; max-width: 600px; padding: 2rem; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center; }
        h1 { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
        th, td { padding: 1rem; border-bottom: 2px solid #eee; font-size: 1.2rem; text-align: center; }
        th { color: #636e72; }
        .home-btn { padding: 1rem 2rem; background: var(--primary-color); color: white; text-decoration: none; border-radius: 20px; font-size: 1.3rem; font-family: 'Jua', sans-serif; box-shadow: 0 5px 0 #d63031; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 명예의 전당 🏆</h1>
        <table>
            <thead>
                <tr><th>날짜</th><th>게임 이름</th><th>최고 기록</th></tr>
            </thead>
            <tbody id="record-body"></tbody>
        </table>
        <a href="index.html" class="home-btn">홈으로 돌아가기</a>
    </div>
    <script>
        const records = JSON.parse(localStorage.getItem('game_records') || '{}');
        const tbody = document.getElementById('record-body');
        if (Object.keys(records).length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">아직 기록이 없어요! 게임을 시작해 보세요!</td></tr>';
        } else {
            for (const game in records) {
                const row = document.createElement('tr');
                row.innerHTML = '<td>' + records[game].date + '</td><td>' + game + '</td><td>' + records[game].score + '</td>';
                tbody.appendChild(row);
            }
        }
    </script>
</body>
</html>
