<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐰 내 사진으로 하는 점프 게임! 🐰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --sky-color: #87CEEB;
            --grass-color: #7cfc00;
            --ground-height: 80px;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: var(--sky-color);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #4fa9ff 0%, #87CEEB 100%);
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
            transition: transform 0.1s linear;
        }

        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: var(--ground-height);
            background-color: var(--grass-color);
            border-top: 10px solid #5eb300;
            z-index: 10;
        }

        #player {
            position: absolute;
            bottom: var(--ground-height);
            left: 50px;
            width: 80px;
            height: 80px;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: bottom 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }

        #player img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 배경이 투명한 PNG 파일일 때 가장 예쁩니다 */
        }

        .obstacle {
            position: absolute;
            bottom: var(--ground-height);
            width: 50px;
            height: 50px;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 100;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 200;
            background: rgba(255,255,255,0.9);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid var(--grass-color);
        }

        #message h1 {
            font-size: 3rem;
            color: #ff4757;
            margin: 0 0 1rem 0;
        }

        #restart-btn {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-family: 'Jua', sans-serif;
            background: #fffa65;
            border: 4px solid #fbc02d;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #fbc02d;
        }
    
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: white;
            color: #333;
            text-decoration: none;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            border-radius: 15px;
            box-shadow: 0 4px 0 #ccc;
            z-index: 1000;
            transition: all 0.2s;
            border: 2px solid #eee;
        }
        .home-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ccc;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }
    
</style>
</head>
<body style="position:relative;"
        <a href="index.html" class="home-btn">🏠 홈으로</a>
     onclick="jump()" ontouchstart="jump()">
    <div id="game-container">
        <div id="score-board">점수: 0</div>
        <div id="player">
            <img id="playerImg" src="player_idle.png" alt="player">
        </div>
        <div id="ground"></div>
        <div id="message">
            <h1>GAME OVER! 😵</h1>
            <button id="restart-btn" onclick="restartGame()">다시 시작!</button>
        </div>
    </div>

    <script>
function saveHighScore(gameName, score, isLowerBetter = false) {
    const records = JSON.parse(localStorage.getItem('game_records') || '{}');
    const today = new Date().toLocaleDateString();
    const currentBest = records[gameName] ? records[gameName].score : (isLowerBetter ? Infinity : -1);
    if (isLowerBetter ? (score < currentBest) : (score > currentBest)) {
        records[gameName] = { score: score, date: today };
        localStorage.setItem('game_records', JSON.stringify(records));
    }
}

        // ==========================================
        // 📸 사진 설정 부분 (여기서 파일 이름을 바꾸세요!)
        // ==========================================
        const IMAGE_CONFIG = {
            idle: 'player_idle.png', // 평소 사진
            jump: 'player_jump.png',   // 점프할 때 사진
            dead: 'player_dead.png'    // 부딪혔을 때 사진
        };
        // ==========================================

        const player = document.getElementById('player');
        const playerImg = document.getElementById('playerImg');
        const gameContainer = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const message = document.getElementById('message');
        
        let isJumping = false;
        let score = 0;
        let gameActive = true;
        let obstacleSpeed = 6;
        let spawnRate = 1500;
        let lastSpawnTime = 0;
        let clouds = [];

        function createCloud() {
            const cloud = document.createElement('div');
            cloud.classList.add('cloud');
            const width = Math.random() * 100 + 100;
            const height = width / 3;
            cloud.style.width = width + 'px';
            cloud.style.height = height + 'px';
            cloud.style.top = Math.random() * (window.innerHeight * 0.6) + 'px';
            cloud.style.left = window.innerWidth + 'px';
            const speed = Math.random() * 0.5 + 0.2;
            clouds.push({ element: cloud, x: window.innerWidth, speed: speed });
            gameContainer.appendChild(cloud);
        }

        function updateClouds() {
            clouds.forEach((cloud, index) => {
                cloud.x -= cloud.speed;
                cloud.element.style.left = cloud.x + 'px';
                if (cloud.x < -200) {
                    cloud.element.remove();
                    clouds.splice(index, 1);
                }
            });
        }

        function setExpression(state) {
            // 설정된 사진이 있으면 적용하고, 없으면 기본 사진을 사용합니다.
            if (state === 'jump') playerImg.src = IMAGE_CONFIG.jump;
            else if (state === 'dead') playerImg.src = IMAGE_CONFIG.dead;
            else playerImg.src = IMAGE_CONFIG.idle;
        }

        function jump() {
            if (!gameActive) return;
            if (isJumping) return;

            isJumping = true;
            setExpression('jump');
            player.style.bottom = '200px';
            
            setTimeout(() => {
                player.style.bottom = '80px';
                setTimeout(() => {
                    isJumping = false;
                    if(gameActive) setExpression('idle');
                }, 400);
            }, 400);
        }

        function spawnObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = ['🌵', '📦', '🪨', '🍄', '💣'][Math.floor(Math.random() * 5)];
            obstacle.style.right = '-100px';
            gameContainer.appendChild(obstacle);

            let pos = -100;
            const moveInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(moveInterval);
                    return;
                }
                pos += obstacleSpeed;
                obstacle.style.right = pos + 'px';

                const playerRect = player.getBoundingClientRect();
                const obsRect = obstacle.getBoundingClientRect();

                if (
                    playerRect.right > obsRect.left + 10 &&
                    playerRect.left < obsRect.right - 10 &&
                    playerRect.bottom > obsRect.top + 10
                ) {
                    gameOver();
                }

                if (pos > window.innerWidth + 100) {
                    clearInterval(moveInterval);
                    obstacle.remove();
                    score++;
                    scoreBoard.innerText = '점수: ' + score;
                    if (score % 5 === 0) obstacleSpeed += 0.3;
                }
            }, 10);
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;
            updateClouds();
            if (Math.random() < 0.005) createCloud();
            if (timestamp - lastSpawnTime > spawnRate) {
                spawnObstacle();
                lastSpawnTime = timestamp;
                spawnRate = Math.max(800, spawnRate - 10);
            }
            requestAnimationFrame(gameLoop);
        }

        function gameOver() { saveHighScore("깡총깡총 점프", score);
            gameActive = false;
            setExpression('dead');
            message.style.display = 'block';
        }

        function restartGame() {
            location.reload();
        }

        window.addEventListener('resize', () => {
            player.style.bottom = '80px';
        });

        for (let i = 0; i < 5; i++) {
            const x = Math.random() * window.innerWidth;
            const cloud = document.createElement('div');
            cloud.classList.add('cloud');
            const width = Math.random() * 100 + 100;
            cloud.style.width = width + 'px';
            cloud.style.height = (width/3) + 'px';
            cloud.style.top = Math.random() * (window.innerHeight * 0.6) + 'px';
            cloud.style.left = x + 'px';
            clouds.push({ element: cloud, x: x, speed: Math.random() * 0.5 + 0.2 });
            gameContainer.appendChild(cloud);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
