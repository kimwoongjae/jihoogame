<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐰 깡총깡총 점프! 🐰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --sky-color: #87CEEB;
            --grass-color: #7cfc00;
            --player-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: var(--sky-color);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            border-bottom: 10vh solid var(--grass-color);
            box-sizing: border-box;
        }

        #player {
            position: absolute;
            bottom: 10vh;
            left: 50px;
            width: 60px;
            height: 60px;
            font-size: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .obstacle {
            position: absolute;
            bottom: 10vh;
            width: 50px;
            height: 50px;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 20;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 100;
        }

        #message h1 {
            font-size: 3rem;
            color: #ff4757;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0 white;
        }

        #restart-btn {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-family: 'Jua', sans-serif;
            background: #fffa65;
            border: 4px solid #fbc02d;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #fbc02d;
        }

        #restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #fbc02d;
        }

        /* Cloud decorations */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.7;
            z-index: 1;
        }
    
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: white;
            color: #333;
            text-decoration: none;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            border-radius: 15px;
            box-shadow: 0 4px 0 #ccc;
            z-index: 1000;
            transition: all 0.2s;
            border: 2px solid #eee;
        }
        .home-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ccc;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }
    
</style>
</head>
<body onclick="jump()" ontouchstart="jump()">
    <div id="game-container">
        <div id="score-board">점수: 0</div>
        <div id="player">🐰</div>
        <div id="message">
            <h1>GAME OVER! 😵</h1>
            <button id="restart-btn" onclick="restartGame()">다시 시작!</button>
        </div>
    </div>

    <script>
    const Sound = {
        play: (freq, type, duration, volume = 0.1) => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        },
        correct: () => Sound.play(880, 'sine', 0.2),
        wrong: () => Sound.play(220, 'sawtooth', 0.3),
        win: () => {
            Sound.play(523.25, 'sine', 0.2);
            setTimeout(() => Sound.play(659.25, 'sine', 0.2), 150);
            setTimeout(() => Sound.play(783.99, 'sine', 0.4), 300);
        },
        jump: () => Sound.play(400, 'sine', 0.2, 0.1),
        hit: () => Sound.play(100, 'square', 0.3, 0.2),
        click: () => Sound.play(600, 'sine', 0.1, 0.05),
        move: () => Sound.play(300, 'sine', 0.1, 0.05)
    };

        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board');
        const message = document.getElementById('message');
        
        let isJumping = false;
        let score = 0;
        let gameActive = true;
        let obstacleSpeed = 5;
        let spawnRate = 1500;
        let lastSpawnTime = 0;

        function jump() { Sound.jump();
            if (!gameActive) return;
            if (isJumping) return;

            isJumping = true;
            player.style.bottom = '250px';
            
            setTimeout(() => {
                player.style.bottom = '100px';
                setTimeout(() => {
                    isJumping = false;
                }, 300);
            }, 300);
        }

        function spawnObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = ['🌵', '📦', '🪨', '🍄'][Math.floor(Math.random() * 4)];
            obstacle.style.right = '-100px';
            gameContainer.appendChild(obstacle);

            let pos = -100;
            const moveInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(moveInterval);
                    return;
                }
                
                pos += obstacleSpeed;
                obstacle.style.right = pos + 'px';

                // Collision Detection
                const playerRect = player.getBoundingClientRect();
                const obsRect = obstacle.getBoundingClientRect();

                if (
                    playerRect.right > obsRect.left &&
                    playerRect.left < obsRect.right &&
                    playerRect.bottom > obsRect.top
                ) {
                    Sound.hit(); gameOver();
                }

                if (pos > window.innerWidth + 100) {
                    clearInterval(moveInterval);
                    obstacle.remove();
                    score++;
                    scoreBoard.innerText = '점수: ' + score;
                    
                    // Increase difficulty
                    if (score % 5 === 0) {
                        obstacleSpeed += 0.2;
                    }
                }
            }, 10);
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;

            if (timestamp - lastSpawnTime > spawnRate) {
                spawnObstacle();
                lastSpawnTime = timestamp;
                // Gradually increase spawn rate
                spawnRate = Math.max(800, spawnRate - 10);
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            message.style.display = 'block';
        }

        function restartGame() {
            location.reload();
        }

        // Clouds
        for (let i = 0; i < 5; i++) {
            const cloud = document.createElement('div');
            cloud.classList.add('cloud');
            cloud.style.width = (Math.random() * 100 + 100) + 'px';
            cloud.style.height = '40px';
            cloud.style.top = (Math.random() * 200) + 'px';
            cloud.style.left = (Math.random() * window.innerWidth) + 'px';
            gameContainer.appendChild(cloud);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
