<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 알록달록 짝 맞추기! 🎨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --bg-color: #fff9c4;
            --card-back: #ffcc80;
            --card-front: #ffffff;
            --primary-color: #ff7043;
            --text-color: #5d4037;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 0 white;
        }

        .info {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .game-board { width: min(90vw, 450px); grid-template-columns: repeat(4, 1fr); gap: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            perspective: 1000px;
            width: 90%;
            max-width: 450px;
        }

        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 15px;
            box-shadow: 0 6px 0 #d8a461;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face { font-size: clamp(1.5rem, 8vw, 3rem);
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            border-radius: 15px;
            border: 4px solid var(--white);
        }

        .card-front {
            background-color: var(--card-back);
            color: var(--card-back); /* Hidden emoji color */
        }

        .card-back {
            background-color: var(--card-front);
            transform: rotateY(180deg);
        }

        #success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #success-overlay h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ffeb3b;
        }

        #restart-btn {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-family: 'Jua', sans-serif;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d84315;
        }

        #restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d84315;
        }
    
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: white;
            color: #333;
            text-decoration: none;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            border-radius: 15px;
            box-shadow: 0 4px 0 #ccc;
            z-index: 1000;
            transition: all 0.2s;
            border: 2px solid #eee;
        }
        .home-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ccc;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }
    
</style>
</head>
<body>
        <a href="index.html" class="home-btn">🏠 홈으로</a>
    
    <h1>🎨 짝 맞추기 게임 🎨</h1>
    <div class="info">시도 횟수: <span id="attempts">0</span></div>
    
    <div class="game-board" id="board">
        <!-- Cards will be generated by JS -->
    </div>

    <div id="success-overlay">
        <h2>🎉 대단해요! 🎉</h2>
        <p style="font-size: 1.5rem; margin-bottom: 2rem;">모든 짝을 다 찾았어요!</p>
        <button id="restart-btn" onclick="location.reload()">다시 하기</button>
    </div>

    <script>
    const Sound = {
        play: (freq, type, duration, volume = 0.1) => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        },
        correct: () => Sound.play(880, 'sine', 0.2),
        wrong: () => Sound.play(220, 'sawtooth', 0.3),
        win: () => {
            Sound.play(523.25, 'sine', 0.2);
            setTimeout(() => Sound.play(659.25, 'sine', 0.2), 150);
            setTimeout(() => Sound.play(783.99, 'sine', 0.4), 300);
        },
        jump: () => Sound.play(400, 'sine', 0.2, 0.1),
        hit: () => Sound.play(100, 'square', 0.3, 0.2),
        click: () => Sound.play(600, 'sine', 0.1, 0.05),
        move: () => Sound.play(300, 'sine', 0.1, 0.05)
    };

        const emojis = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉', '🥝', '🍍'];
        let cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedPairs = 0;
        let attempts = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            const board = document.getElementById('board');
            const shuffledCards = shuffle(cards);

            shuffledCards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face card-front">❓</div>
                    <div class="card-face card-back">${emoji}</div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() { Sound.click();
            if (this.classList.contains('flipped') || flippedCards.length === 2) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                attempts++;
                document.getElementById('attempts').innerText = attempts;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.emoji === card2.dataset.emoji;

            if (match) { Sound.correct();
                matchedPairs++;
                flippedCards = [];
                if (matchedPairs === emojis.length) {
                    setTimeout(() => {
                        Sound.win(); document.getElementById('success-overlay').style.display = 'flex';
                    }, 600);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        createBoard();
    </script>
</body>
</html>
