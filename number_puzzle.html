<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔢 무한 숫자 퍼즐! 🔢</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --bg-color: #e8f5e9;
            --tile-color: #81c784;
            --tile-empty: #c8e6c9;
            --primary-color: #2e7d32;
            --text-color: #1b5e20;
            --white: #ffffff;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: white;
            color: #333;
            text-decoration: none;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            border-radius: 15px;
            box-shadow: 0 4px 0 #ccc;
            z-index: 1000;
            transition: all 0.2s;
            border: 2px solid #eee;
        }
        .home-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ccc;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 0 white;
        }

        .status-bar {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 20px;
        }

        .puzzle-board {
            display: grid;
            background: var(--primary-color);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 0 #1b5e20;
            transition: all 0.3s ease;
        }

        .tile {
            background-color: var(--tile-color);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Jua', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #4caf50;
            user-select: none;
        }

        .tile:hover {
            background-color: #a5d6a7;
            transform: scale(1.02);
        }

        .tile.empty {
            background-color: var(--tile-empty);
            cursor: default;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
            border: 2px dashed #a5d6a7;
        }

        #success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #success-overlay h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ffeb3b;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        .action-btn {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-family: 'Jua', sans-serif;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b5e20;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b5e20;
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">🏠 홈으로</a>
    <h1>🔢 무한 숫자 퍼즐 🔢</h1>
    <div class="status-bar">
        <div>레벨: <span id="level">1</span></div>
        <div>이동: <span id="moves">0</span></div>
    </div>
    
    <div class="puzzle-board" id="board"></div>

    <div id="success-overlay">
        <h2 id="win-text">🎉 성공했어요! 🎉</h2>
        <p style="font-size: 1.5rem; margin-bottom: 2rem;">숫자를 완벽하게 맞췄습니다!</p>
        <div class="btn-group">
            <button class="action-btn" onclick="location.reload()">처음부터</button>
            <button class="action-btn" id="next-level-btn" onclick="nextLevel()">다음 레벨로!</button>
        </div>
    </div>

    <script>
function saveHighScore(gameName, score, isLowerBetter = false) {
    const records = JSON.parse(localStorage.getItem('game_records') || '{}');
    const today = new Date().toLocaleDateString();
    const currentBest = records[gameName] ? records[gameName].score : (isLowerBetter ? Infinity : -1);
    if (isLowerBetter ? (score < currentBest) : (score > currentBest)) {
        records[gameName] = { score: score, date: today };
        localStorage.setItem('game_records', JSON.stringify(records));
    }
}

        let level = 1;
        let moves = 0;
        let size = 3;
        let tiles = [];
        
        const boardElement = document.getElementById('board');

        function createBoard() {
            // Update size based on level
            size = 2 + level; // Level 1=3x3, Level 2=4x4...
            
            // Initialize tiles
            tiles = [];
            for (let i = 1; i < size * size; i++) tiles.push(i);
            tiles.push(null);

            // Shuffle
            shuffle();

            // Update CSS Grid
            boardElement.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            boardElement.style.width = (size * 100) + 'px';
            boardElement.style.height = (size * 100) + 'px';
            
            boardElement.innerHTML = '';
            tiles.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                tileDiv.classList.add('tile');
                if (tile === null) {
                    tileDiv.classList.add('empty');
                    tileDiv.innerText = '';
                } else {
                    tileDiv.innerText = tile;
                    tileDiv.style.width = '90px';
                    tileDiv.style.height = '90px';
                    tileDiv.style.fontSize = size > 4 ? '1.5rem' : '2.5rem';
                    tileDiv.onclick = () => moveTile(index);
                }
                boardElement.appendChild(tileDiv);
            });
        }

        function moveTile(index) {
            const emptyIndex = tiles.indexOf(null);
            const row = Math.floor(index / size);
            const col = index % size;
            const emptyRow = Math.floor(emptyIndex / size);
            const emptyCol = emptyIndex % size;

            const isAdjacent = (Math.abs(row - emptyRow) === 1 && col === emptyCol) ||
                               (Math.abs(col - emptyCol) === 1 && row === emptyRow);

            if (isAdjacent) {
                [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
                moves++;
                document.getElementById('moves').innerText = moves;
                createBoard();
                checkWin();
            }
        }

        function checkWin() {
            const winState = [];
            for(let i=1; i < size*size; i++) winState.push(i);
            winState.push(null);

            const isWin = tiles.every((val, idx) => val === winState[idx]);
            saveHighScore("숫자 밀기 퍼즐", level); if (isWin) {
                setTimeout(() => {
                    document.getElementById('success-overlay').style.display = 'flex';
                }, 300);
            }
        }

        function shuffle() {
            // To ensure solvable, simulate random moves
            for (let i = 0; i < 200; i++) {
                const emptyIndex = tiles.indexOf(null);
                const neighbors = [];
                const row = Math.floor(emptyIndex / size);
                const col = emptyIndex % size;
                if (row > 0) neighbors.push(emptyIndex - size);
                if (row < size - 1) neighbors.push(emptyIndex + size);
                if (col > 0) neighbors.push(emptyIndex - 1);
                if (col < size - 1) neighbors.push(emptyIndex + 1);
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                [tiles[emptyIndex], tiles[randomNeighbor]] = [tiles[randomNeighbor], tiles[emptyIndex]];
            }
        }

        function nextLevel() {
            level++;
            moves = 0;
            document.getElementById('level').innerText = level;
            document.getElementById('moves').innerText = moves;
            document.getElementById('success-overlay').style.display = 'none';
            createBoard();
        }

        document.getElementById('level').innerText = level;
        createBoard();
    </script>
</body>
</html>
