<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔢 숫자 밀기 퍼즐! 🔢</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --bg-color: #e8f5e9;
            --tile-color: #81c784;
            --tile-empty: #c8e6c9;
            --primary-color: #2e7d32;
            --text-color: #1b5e20;
            --white: #ffffff;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 0 white;
        }

        .instruction {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #666;
        }

        .puzzle-board { width: min(90vw, 300px); height: min(90vw, 300px);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--primary-color);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 0 #1b5e20;
            width: 300px;
            height: 300px;
        }

        .tile { width: calc(100% / 3 - 10px); height: calc(100% / 3 - 10px); font-size: clamp(1.5rem, 8vw, 2.5rem);
            width: 90px;
            height: 90px;
            background-color: var(--tile-color);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-family: 'Jua', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #4caf50;
            user-select: none;
        }

        .tile:hover {
            background-color: #a5d6a7;
            transform: scale(1.02);
        }

        .tile.empty {
            background-color: var(--tile-empty);
            cursor: default;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
            border: 2px dashed #a5d6a7;
        }
        .tile.empty:hover {
            transform: none;
            background-color: var(--tile-empty);
        }

        #success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #success-overlay h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ffeb3b;
        }

        #restart-btn {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-family: 'Jua', sans-serif;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b5e20;
        }

        #restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b5e20;
        }
    
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: white;
            color: #333;
            text-decoration: none;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            border-radius: 15px;
            box-shadow: 0 4px 0 #ccc;
            z-index: 1000;
            transition: all 0.2s;
            border: 2px solid #eee;
        }
        .home-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ccc;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }
    
</style>
</head>
<body>
        <a href="index.html" class="home-btn">🏠 홈으로</a>
    
    <h1>🔢 숫자 밀기 퍼즐 🔢</h1>
    <div class="instruction">숫자를 밀어서 1부터 8까지 순서대로 맞춰보세요!</div>
    
    <div class="puzzle-board" id="board">
        <!-- Tiles will be generated by JS -->
    </div>

    <div id="success-overlay">
        <h2>🎉 성공했어요! 🎉</h2>
        <p style="font-size: 1.5rem; margin-bottom: 2rem;">숫자를 완벽하게 맞췄습니다!</p>
        <button id="restart-btn" onclick="location.reload()">다시 하기</button>
    </div>

    <script>
    const Sound = {
        play: (freq, type, duration, volume = 0.1) => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        },
        correct: () => Sound.play(880, 'sine', 0.2),
        wrong: () => Sound.play(220, 'sawtooth', 0.3),
        win: () => {
            Sound.play(523.25, 'sine', 0.2);
            setTimeout(() => Sound.play(659.25, 'sine', 0.2), 150);
            setTimeout(() => Sound.play(783.99, 'sine', 0.4), 300);
        },
        jump: () => Sound.play(400, 'sine', 0.2, 0.1),
        hit: () => Sound.play(100, 'square', 0.3, 0.2),
        click: () => Sound.play(600, 'sine', 0.1, 0.05),
        move: () => Sound.play(300, 'sine', 0.1, 0.05)
    };

        const boardElement = document.getElementById('board');
        let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null]; // null is the empty space
        let moves = 0;

        function createBoard() {
            boardElement.innerHTML = '';
            tiles.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                tileDiv.classList.add('tile');
                if (tile === null) {
                    tileDiv.classList.add('empty');
                    tileDiv.innerText = '';
                } else {
                    tileDiv.innerText = tile;
                    tileDiv.onclick = () => moveTile(index);
                }
                boardElement.appendChild(tileDiv);
            });
        }

        function moveTile(index) {
            const emptyIndex = tiles.indexOf(null);
            const row = Math.floor(index / 3);
            const col = index % 3;
            const emptyRow = Math.floor(emptyIndex / 3);
            const emptyCol = emptyIndex % 3;

            // Check if clicked tile is adjacent to empty space
            const isAdjacent = (Math.abs(row - emptyRow) === 1 && col === emptyCol) ||
                               (Math.abs(col - emptyCol) === 1 && row === emptyRow);

            if (isAdjacent) { Sound.move();
                // Swap
                [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
                createBoard();
                checkWin();
            }
        }

        function checkWin() {
            const winState = [1, 2, 3, 4, 5, 6, 7, 8, null];
            const isWin = tiles.every((val, idx) => val === winState[idx]);
            if (isWin) {
                setTimeout(() => {
                    Sound.win(); document.getElementById('success-overlay').style.display = 'flex';
                }, 300);
            }
        }

        function shuffle() {
            // To ensure the puzzle is solvable, we simulate random valid moves
            for (let i = 0; i < 100; i++) {
                const emptyIndex = tiles.indexOf(null);
                const neighbors = [];
                const row = Math.floor(emptyIndex / 3);
                const col = emptyIndex % 3;

                if (row > 0) neighbors.push(emptyIndex - 3);
                if (row < 2) neighbors.push(emptyIndex + 3);
                if (col > 0) neighbors.push(emptyIndex - 1);
                if (col < 2) neighbors.push(emptyIndex + 1);

                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                [tiles[emptyIndex], tiles[randomNeighbor]] = [tiles[randomNeighbor], tiles[emptyIndex]];
            }
        }

        shuffle();
        createBoard();
    </script>
</body>
</html>
