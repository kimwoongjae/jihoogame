<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 마법 수학 모험 ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --primary-color: #ffeb3b;
            --secondary-color: #ff9800;
            --accent-color: #e91e63;
            --bg-color: #e0f7fa;
            --text-color: #455a64;
            --white: #ffffff;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 40px;
            box-shadow: 0 20px 0px #b2ebf2, 0 30px 50px rgba(0,0,0,0.1);
            text-align: center;
            border: 8px solid var(--primary-color);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .score-board {
            background: var(--primary-color);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 1.5rem;
            box-shadow: 0 4px 0 #fbc02d;
        }

        .level-badge {
            background: var(--secondary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #f57c00;
        }

        .problem-area {
            background: #fffde7;
            padding: 2rem;
            border-radius: 30px;
            margin-bottom: 2rem;
            border: 4px dashed var(--secondary-color);
        }

        .problem-text {
            font-size: 4rem;
            margin: 0;
            color: var(--text-color);
            text-shadow: 2px 2px 0px #fff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .option-btn {
            background: var(--white);
            border: 4px solid var(--primary-color);
            padding: 1.5rem;
            font-size: 2.5rem;
            font-family: 'Jua', sans-serif;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 var(--primary-color);
            color: var(--text-color);
        }

        .option-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 var(--primary-color);
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-color);
        }

        .option-btn.correct {
            background-color: #c8e6c9;
            border-color: #4caf50;
            box-shadow: 0 8px 0 #388e3c;
            color: #2e7d32;
        }

        .option-btn.wrong {
            background-color: #ffcdd2;
            border-color: #f44336;
            box-shadow: 0 8px 0 #d32f2f;
            color: #c62828;
        }

        .message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            text-shadow: 2px 2px 0 white;
        }

        .show-message {
            opacity: 1;
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .star-container {
            font-size: 2rem;
            margin-top: 1rem;
            color: #fbc02d;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="level-badge">레벨 <span id="level">1</span></div>
            <div class="score-board">⭐ <span id="score">0</span></div>
        </div>

        <div class="problem-area">
            <p class="problem-text" id="problem">? + ? = ?</p>
        </div>

        <div class="options-grid" id="options">
            <!-- Options will be generated by JS -->
        </div>

        <div class="star-container" id="stars"></div>
        <div class="message-overlay" id="message">정답이야! ✨</div>
    </div>

    <script>
        let score = 0;
        let level = 1;
        let currentAnswer = 0;
        
        const praiseMessages = ["최고야! 👍", "정답이야! ✨", "우와! 정말 똑똑해! 🌟", "완벽해! 🎈", "대단해! 🌈"];
        const tryAgainMessages = ["아까워! 다시 해볼까? 🍀", "괜찮아! 다시 생각해보자! 😊", "거의 다 왔어! 힘내! 💪"];

        function generateProblem() {
            // Increase number range based on level
            const range = 5 + (level * 2);
            const isAddition = Math.random() > 0.5;
            
            let a, b;
            if (isAddition) {
                a = Math.floor(Math.random() * range) + 1;
                b = Math.floor(Math.random() * range) + 1;
                currentAnswer = a + b;
                document.getElementById('problem').innerText = `${a} + ${b} = ?`;
            } else {
                a = Math.floor(Math.random() * range) + 5; // Ensure result is positive
                b = Math.floor(Math.random() * a) + 1;
                currentAnswer = a - b;
                document.getElementById('problem').innerText = `${a} - ${b} = ?`;
            }

            generateOptions();
        }

        function generateOptions() {
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            const options = [];
            options.push(currentAnswer);

            while (options.length < 4) {
                const wrong = currentAnswer + Math.floor(Math.random() * 5) - 2;
                if (wrong !== currentAnswer && wrong >= 0) {
                    options.push(wrong);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const msgEl = document.getElementById('message');
            
            if (selected === currentAnswer) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = score;
                
                // Update level every 5 points
                if (score % 5 === 0) {
                    level++;
                    document.getElementById('level').innerText = level;
                }

                msgEl.innerText = praiseMessages[Math.floor(Math.random() * praiseMessages.length)];
                msgEl.classList.add('show-message');
                
                // Disable all buttons to prevent multiple clicks
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(b => b.style.pointerEvents = 'none');

                setTimeout(() => {
                    msgEl.classList.remove('show-message');
                    generateProblem();
                }, 1200);
            } else {
                btn.classList.add('wrong');
                msgEl.innerText = tryAgainMessages[Math.floor(Math.random() * tryAgainMessages.length)];
                msgEl.classList.add('show-message');

                setTimeout(() => {
                    msgEl.classList.remove('show-message');
                    btn.classList.remove('wrong');
                }, 1000);
            }
        }

        // Start game
        generateProblem();
    </script>
</body>
</html>
